# Tap dances: the n-th [[tap_dance]] is TD(n). Fields of Vial's tap dance entry;
# custom_tapping_term (ms) is also the double-tap window.
[[tap_dance]]
on_tap = "0"
on_hold = "RPRN"
on_double_tap = "NO"
on_tap_hold = "NO"
custom_tapping_term = 200

