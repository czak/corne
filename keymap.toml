# QMK settings (QMK config.h names)
[settings]
GRAVE_ESC_ALT_OVERRIDE = false
GRAVE_ESC_CTRL_OVERRIDE = false
GRAVE_ESC_GUI_OVERRIDE = false
GRAVE_ESC_SHIFT_OVERRIDE = false
COMBO_TERM = 50
AUTO_SHIFT_ENABLE = false
AUTO_SHIFT_MODIFIERS = false
NO_AUTO_SHIFT_SPECIAL = false
NO_AUTO_SHIFT_NUMERIC = false
NO_AUTO_SHIFT_ALPHA = false
AUTO_SHIFT_REPEAT = false
AUTO_SHIFT_NO_AUTO_REPEAT = false
AUTO_SHIFT_TIMEOUT = 175
ONESHOT_TAP_TOGGLE = 5
ONESHOT_TIMEOUT = 5000
TAPPING_TERM = 200
PERMISSIVE_HOLD = false
IGNORE_MOD_TAP_INTERRUPT = false
TAPPING_FORCE_HOLD = false
RETRO_TAPPING = false
MOUSEKEY_DELAY = 10
MOUSEKEY_INTERVAL = 20
MOUSEKEY_MOVE_DELTA = 8
MOUSEKEY_MAX_SPEED = 10
MOUSEKEY_TIME_TO_MAX = 30
MOUSEKEY_WHEEL_DELAY = 10
MOUSEKEY_WHEEL_INTERVAL = 80
MOUSEKEY_WHEEL_MAX_SPEED = 8
TAP_CODE_DELAY = 50
TAP_HOLD_CAPS_DELAY = 80
TAPPING_TOGGLE = 5
swap_control_capslock = false
capslock_to_control = false
swap_lalt_lgui = false
swap_ralt_rgui = false
no_gui = false
swap_grave_esc = false
swap_backslash_backspace = false
nkro = false
swap_lctl_lgui = false
swap_rctl_rgui = false

# Layer order = layer index. Each half: top (7), home (7), bottom (6), thumbs (3);
# left-to-right as seen from above. Keycodes: vial-gui names without KC_.
# The firmware has a fixed 8 layers and push needs all of them: keep unused ones as all-NO layers.
[layers.BASE]
left = [
  ["ESCAPE", "Q", "W", "E", "R", "T", "LALT"],
  ["OSM(MOD_LCTL)", "A", "S", "D", "F", "G", "TAB"],
  ["LSHIFT", "Z", "X", "C", "V", "B"],
  ["LGUI", "MO(NUM)", "SPACE"],
]
right = [
  ["F14", "Y", "U", "I", "O", "P", "BSPACE"],
  ["RSHIFT", "H", "J", "K", "L", "SCOLON", "QUOTE"],
  ["N", "M", "COMMA", "DOT", "SLASH", "DELETE"],
  ["ENTER", "MO(SYM)", "RGUI"],
]

[layers.NUM]
left = [
  ["TAB", "1", "2", "3", "4", "5", "LCTRL"],
  ["LCTRL", "A", "S", "D", "F", "G", "LALT"],
  ["LSHIFT", "Z", "X", "C", "V", "B"],
  ["LGUI", "MO(NUM)", "SPACE"],
]
right = [
  ["RCTRL", "6", "7", "8", "9", "0", "BSPACE"],
  ["RALT", "LEFT", "DOWN", "UP", "RIGHT", "SCOLON", "QUOTE"],
  ["N", "M", "COMMA", "DOT", "SLASH", "ESCAPE"],
