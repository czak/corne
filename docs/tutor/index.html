<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corne typing tutor</title>
<link rel="stylesheet" href="tutor.css">
</head>
<body>
<main>
<a class="gh" href="https://github.com/czak/corne" aria-label="GitHub" title="GitHub"><svg viewBox="0 0 16 16" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a>

<section id="setup">
  <div class="row"><label>Sample <select id="sample"><option value="">Choose a sample text…</option></select></label></div>
  <textarea id="src" spellcheck="false" placeholder="Paste some text here…"></textarea>
  <div class="row"><button class="primary" id="start" title="Ctrl+Enter">Start typing</button>
    <span id="warn"></span></div>
</section>

<section id="play" class="hidden">
  <div class="stats">
    <div class="stat"><b id="s-wpm">0</b><span>wpm</span></div>
    <div class="stat"><b id="s-acc">100</b><span>% accuracy</span></div>
    <div class="stat"><b id="s-err">0</b><span>mistakes</span></div>
    <div class="stat"><b id="s-pos">0</b><span id="s-len">/ 0</span></div>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="stage mono"><div class="strip" id="strip"></div></div>
  <div class="hint" id="hint"></div>
</section>

<section id="done" class="hidden">
  <div class="result">
    <div class="big" id="r-wpm"></div>
    <div class="muted" id="r-line"></div>
    <p class="missed" id="r-missed"></p>
    <div class="row" style="justify-content:center">
      <button class="primary" id="again">Again</button><button id="new">New text</button></div>
  </div>
</section>

<div class="kbd" id="kbdwrap">
</div>
<div class="toolbar"><button id="toggle-focus">Show all labels</button><button id="toggle-kbd">Hide keyboard</button></div>
</main>

<script src="keymap.js"></script>
<script src="samples.js"></script>
<script src="tutor.js"></script>
</body>
</html>
